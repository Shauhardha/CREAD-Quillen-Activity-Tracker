name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code onto the GitHub runner ──────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Build frontend on the fast GitHub runner ──────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create aws-exports.js
        env:
          AWS_EXPORTS: ${{ secrets.AWS_EXPORTS }}
        run: echo "$AWS_EXPORTS" > frontend/src/aws-exports.js

      - name: Create frontend .env
        run: echo "VITE_API_BASE=${{ secrets.VITE_API_BASE }}" > frontend/.env

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── 3. Copy built dist/ folder to EC2 via SCP ────────────────
      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/"
          target: "/tmp/cread-dist"
          strip_components: 2

      # ── 4. SSH in only for backend + nginx (no build needed) ─────
      - name: Deploy backend and reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            echo "=== Backend Deploy ==="
            cd /home/ec2-user/CREAD-Quillen-Activity-Tracker/backend
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart cread-backend

            echo "=== Frontend Deploy ==="
            sudo rm -rf /var/www/cread/*
            sudo cp -r /tmp/cread-dist/* /var/www/cread/
            rm -rf /tmp/cread-dist

            sudo systemctl restart nginx

            echo "=== Deploy Complete ==="
