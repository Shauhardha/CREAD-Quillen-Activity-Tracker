# =============================================================================
# CREAD & Quillen Activity Tracker — Nginx Configuration
# Deployed to: /etc/nginx/conf.d/cread-quillen.conf
# =============================================================================

# ── Hide Nginx version from all response headers ──────────────────────────────
# Fixes: "Server Leaks Version Information" (Low) from ZAP scan
server_tokens off;


# ── HTTP: redirect everything to HTTPS ────────────────────────────────────────
# This stops the raw IP from serving content over plain HTTP
server {
    listen 80;
    server_name creadquillen.click www.creadquillen.click _;

    return 301 https://creadquillen.click$request_uri;
}


# ── HTTPS: main application ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name creadquillen.click www.creadquillen.click;

    # SSL certificate paths (Let's Encrypt via Certbot)
    ssl_certificate     /etc/letsencrypt/live/creadquillen.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creadquillen.click/privkey.pem;

    # Only allow modern TLS versions
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root  /var/www/cread;
    index index.html;

    # ── Security Headers ───────────────────────────────────────────────────────

    # Fixes: "Content Security Policy (CSP) Header Not Set" (Medium)
    # - default-src 'self'          : block everything not from your own domain by default
    # - script-src 'self'           : only load JS from your own domain
    # - style-src 'self' 'unsafe-inline' : allow inline styles (required by Leaflet maps & Recharts)
    # - img-src 'self' data: blob: https://*.tile.openstreetmap.org
    #                               : allow map tiles from OpenStreetMap
    # - connect-src 'self' ...      : allow API calls to your backend and AWS Cognito auth
    # - font-src 'self'             : only load fonts from your domain
    # - frame-ancestors 'none'      : also prevents clickjacking (modern browsers prefer this over X-Frame-Options)
    # - object-src 'none'           : block Flash / plugin-based attacks
    # - base-uri 'self'             : prevent base tag injection attacks
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https://*.tile.openstreetmap.org;
        connect-src 'self' https://*.amazoncognito.com https://cognito-idp.us-east-1.amazonaws.com;
        font-src 'self';
        frame-ancestors 'none';
        object-src 'none';
        base-uri 'self';
    " always;

    # Fixes: "Missing Anti-Clickjacking Header" (Medium)
    # Belt-and-suspenders alongside CSP frame-ancestors — covers older browsers
    add_header X-Frame-Options "DENY" always;

    # Fixes: "X-Content-Type-Options Header Missing" (Low)
    # Prevents browsers from guessing file types (MIME sniffing attacks)
    add_header X-Content-Type-Options "nosniff" always;

    # Adds HSTS — tells browsers to only ever use HTTPS for this domain for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Limits what information is sent in the Referer header when navigating away
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disables browser features the app does not use
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


    # ── React SPA routing ──────────────────────────────────────────────────────
    # All routes fall back to index.html so React Router handles navigation
    location / {
        try_files $uri $uri/ /index.html;

        # Repeat headers here — Nginx does NOT inherit add_header into location blocks
        # that define their own add_header directives
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: blob: https://*.tile.openstreetmap.org;
            connect-src 'self' https://*.amazoncognito.com https://cognito-idp.us-east-1.amazonaws.com;
            font-src 'self';
            frame-ancestors 'none';
            object-src 'none';
            base-uri 'self';
        " always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }


    # ── Static asset caching ───────────────────────────────────────────────────
    # JS/CSS/images are fingerprinted by Vite (e.g. index-2Ei3oafh.js)
    # so they can be cached aggressively for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Repeat security headers (same Nginx inheritance rule as above)
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: blob: https://*.tile.openstreetmap.org;
            connect-src 'self' https://*.amazoncognito.com https://cognito-idp.us-east-1.amazonaws.com;
            font-src 'self';
            frame-ancestors 'none';
            object-src 'none';
            base-uri 'self';
        " always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
