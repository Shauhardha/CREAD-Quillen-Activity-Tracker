# =============================================================================
# CREAD & Quillen Activity Tracker — Nginx Configuration
# Deployed to: /etc/nginx/conf.d/cread-quillen.conf
#
# Note: SSL/HTTPS is terminated upstream (AWS Load Balancer or similar).
# Nginx only needs to serve HTTP on port 80 with security headers.
# =============================================================================

# Hide Nginx version from all response headers
# Fixes: "Server Leaks Version Information" (Low) from ZAP scan
server_tokens off;


server {
    listen 80;
    server_name creadquillen.click www.creadquillen.click _;

    root  /var/www/cread;
    index index.html;

    # ── Security Headers ───────────────────────────────────────────────────────

    # Fixes: "Content Security Policy (CSP) Header Not Set" (Medium)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://*.amazoncognito.com https://cognito-idp.us-east-1.amazonaws.com; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Fixes: "Missing Anti-Clickjacking Header" (Medium)
    add_header X-Frame-Options "DENY" always;

    # Fixes: "X-Content-Type-Options Header Missing" (Low)
    add_header X-Content-Type-Options "nosniff" always;

    # Tells browsers this site should only be visited over HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Limits referrer information sent to third-party sites
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disables browser features the app does not use
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


    # ── React SPA routing ──────────────────────────────────────────────────────
    # All unknown routes fall back to index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;

        # NOTE: Nginx does NOT inherit add_header from the server block into
        # location blocks that define their own add_header. Repeat all headers.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://*.amazoncognito.com https://cognito-idp.us-east-1.amazonaws.com; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }


    # ── Static asset caching ───────────────────────────────────────────────────
    # Vite fingerprints all JS/CSS filenames so they can be cached for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Repeat security headers (same Nginx inheritance rule as above)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://*.amazoncognito.com https://cognito-idp.us-east-1.amazonaws.com; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
